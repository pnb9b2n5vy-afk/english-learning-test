let level=null,session=[],idx=0,score=0,current=null;
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function setLevel(l){level=l;document.getElementById('home').classList.add('hidden');document.getElementById('dashboard').classList.remove('hidden');document.getElementById('levelTitle').textContent=l==='g3'?'👦 小三文法診斷':'👧 小六文法診斷';fillSelect();renderToc();renderWeak();}
function pool(){return QS.filter(q=>q.level===level);}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function fillSelect(){const s=document.getElementById('unitSelect');s.innerHTML=UNITS.map(u=>`<option value="${u.id}">Unit ${u.id}｜${esc(u.title)}｜${esc(u.desc)}</option>`).join('');}
function startMixed(){session=shuffle(pool()).slice(0,Math.min(15,pool().length));begin();}
function startWeak(){const r=getRec();const weak=Object.entries(r).sort((a,b)=>(b[1].wrong-b[1].right)-(a[1].wrong-a[1].right)).map(x=>+x[0]).slice(0,4);let p=pool().filter(q=>weak.includes(q.unit));if(p.length<10)p=[...p,...pool().filter(q=>!weak.includes(q.unit))];session=shuffle(p).slice(0,Math.min(10,p.length));begin();}
function startUnit(){const u=+document.getElementById('unitSelect').value;let p=pool().filter(q=>q.unit===u);if(!p.length){alert('這一版這個 Unit 還沒有專屬題目；先用混合診斷。');return;}session=shuffle(p);begin();}
function begin(){idx=0;score=0;document.getElementById('result').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');showQ();}
function showQ(){if(idx>=session.length){finish();return;}current=session[idx];const u=UNITS.find(x=>x.id===current.unit);document.getElementById('progress').textContent=`第 ${idx+1} / ${session.length} 題`;document.getElementById('unitTag').textContent=`Unit ${u.id}｜${u.desc}`;document.getElementById('stem').textContent=current.stem;document.getElementById('feedback').classList.add('hidden');document.getElementById('nextBtn').classList.add('hidden');document.getElementById('choices').innerHTML=current.choices.map((c,i)=>`<button class="choice" onclick="answer(${i},this)">${String.fromCharCode(65+i)}. ${esc(c)}</button>`).join('');}
function answer(i,btn){document.querySelectorAll('.choice').forEach(b=>b.disabled=true);const ok=i===current.ans;if(ok)score++;const rec=getRec();if(!rec[current.unit])rec[current.unit]={right:0,wrong:0};rec[current.unit][ok?'right':'wrong']++;saveRec(rec);document.querySelectorAll('.choice').forEach((b,j)=>{if(j===current.ans)b.classList.add('correct');if(j===i&&!ok)b.classList.add('wrong');});const u=UNITS.find(x=>x.id===current.unit),f=document.getElementById('feedback');f.classList.remove('hidden');f.innerHTML=`<div class="stat"><strong>${ok?'✅ 答對了':'❌ 這題要複習'}</strong><br>${esc(current.why)}<br><button onclick="openUnit(${u.id})">📘 回 Unit ${u.id}｜${esc(u.title)}</button></div>`;document.getElementById('nextBtn').classList.remove('hidden');renderWeak();}
function nextQ(){idx++;showQ();}
function finish(){document.getElementById('quiz').classList.add('hidden');const r=document.getElementById('result');r.classList.remove('hidden');r.innerHTML=`<h2>完成</h2><p>這次答對 <strong>${score} / ${session.length}</strong></p><button class="primary" onclick="backDash()">回診斷首頁</button>`;renderWeak();}
function backDash(){document.getElementById('quiz').classList.add('hidden');document.getElementById('result').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'});}
function getRec(){try{return JSON.parse(localStorage.getItem('grammarDiagV12_'+level)||'{}')}catch(e){return {}}}
function saveRec(r){localStorage.setItem('grammarDiagV12_'+level,JSON.stringify(r));}
function renderWeak(){const box=document.getElementById('weakPanel'),r=getRec(),rows=Object.entries(r);if(!rows.length){box.innerHTML='還沒有作答紀錄。';return;}rows.sort((a,b)=>(b[1].wrong-b[1].right)-(a[1].wrong-a[1].right));box.innerHTML=rows.slice(0,8).map(([id,v])=>{const u=UNITS.find(x=>x.id==id),tot=v.right+v.wrong,rate=Math.round(v.right/tot*100);return `<div class="stat"><strong>Unit ${id}｜${esc(u.desc)}</strong><div class="small">答對 ${v.right}，答錯 ${v.wrong}，熟練度 ${rate}%</div><div class="bar"><i style="width:${rate}%"></i></div><button onclick="openUnit(${id})">看 Unit</button></div>`;}).join('');}
function renderToc(){const box=document.getElementById('toc');box.innerHTML=GROUPS.map((g,gi)=>`<div class="stat"><button class="groupTitle" onclick="toggleGroup(${gi})"><strong>${esc(g[0])}｜Unit ${g[1]}–${g[2]}</strong><span id="ga${gi}">▶ 展開</span></button><div id="gg${gi}" class="hidden">${UNITS.filter(u=>u.id>=g[1]&&u.id<=g[2]).map(u=>`<button class="unitBtn" onclick="openUnit(${u.id})">Unit ${u.id}｜${esc(u.title)}<br><span class="small">${esc(u.desc)}</span></button>`).join('')}</div></div>`).join('');}
function toggleGroup(i){const d=document.getElementById('gg'+i),a=document.getElementById('ga'+i),open=d.classList.contains('hidden');d.classList.toggle('hidden',!open);a.textContent=open?'▼ 隱藏':'▶ 展開';}
function openUnit(id){const u=UNITS.find(x=>x.id===+id),p=document.getElementById('unitPanel');p.classList.remove('hidden');const has=pool().some(q=>q.unit===u.id);p.innerHTML=`<h2>Unit ${u.id}｜${esc(u.title)}</h2><h3>${esc(u.desc)}</h3><p>這一頁先做成「精簡導航」：孩子先知道這一課在學什麼，再決定要不要回實體書細讀。</p><div class="stat">📖 實體書對照：直接翻 <strong>Unit ${u.id}</strong></div><div class="row"><button class="primary" ${has?'':'disabled'} onclick="document.getElementById('unitSelect').value='${u.id}';startUnit()">🎯 只練 Unit ${u.id}</button><button onclick="document.getElementById('unitPanel').classList.add('hidden')">收起</button></div>${has?'':'<div class="small">這一版尚未放這個 Unit 的專屬題目；之後可依弱點再補深。</div>'}`;p.scrollIntoView({behavior:'smooth',block:'start'});}
