<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="句子重組">
<title>姊弟英文句子重組</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#1f2937;--muted:#64748b;--line:#dbe2ea;--blue:#2563eb;--green:#15803d;--red:#dc2626;--soft:#eef4ff}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.wrap{max-width:900px;margin:auto;padding:16px 16px 60px} h1{font-size:25px;margin:4px 0} h2{font-size:21px;margin:4px 0 10px} .small{font-size:14px;color:var(--muted);line-height:1.6}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px} .home-card{min-height:150px;border:1px solid var(--line);border-radius:20px;background:white;padding:22px;text-align:left}
.home-card strong{display:block;font-size:25px;margin-bottom:8px} .home-card.g3{border-top:6px solid #10b981} .home-card.g6{border-top:6px solid #2563eb}
button{border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);padding:10px 14px;min-height:46px;font-size:16px} button.primary{background:var(--blue);color:white;border-color:var(--blue)} button:disabled{opacity:.5}
.topbar{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center} select{font-size:16px;min-height:44px;border:1px solid var(--line);border-radius:11px;padding:8px 10px;background:white}
.zh{font-size:23px;line-height:1.65;font-weight:700;margin:10px 0 4px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px} .chip{font-size:13px;background:#f1f5f9;padding:5px 9px;border-radius:999px;color:#475569}
.answer-zone{min-height:92px;border:2px dashed #cbd5e1;border-radius:16px;margin-top:18px;padding:12px;display:flex;gap:8px;flex-wrap:wrap;align-content:flex-start}
.word-bank{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding:4px 0}
.wordbtn{font-size:18px;min-height:48px;padding:10px 13px;background:white;box-shadow:0 1px 2px rgba(0,0,0,.04)} .wordbtn.used{opacity:.28}
.answer-token{font-size:18px;border-color:#93c5fd;background:#eff6ff}
.feedback{margin-top:14px;border-radius:14px;padding:14px;font-size:19px;line-height:1.6;font-weight:750}
.feedback.good{background:#ecfdf5;color:var(--green);border:1px solid #bbf7d0} .feedback.bad{background:#fef2f2;color:var(--red);border:1px solid #fecaca}
.correct-line{margin-top:8px;color:#334155;font-size:17px;font-weight:500}
.progress{height:9px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin-top:10px} .progress>div{height:100%;background:#3b82f6}
.action-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px} .stats{font-size:14px;color:var(--muted)}
.note{padding:12px 14px;border-radius:13px;background:#fffbeb;border:1px solid #fde68a;line-height:1.6;font-size:14px;margin-top:12px}
.hidden{display:none!important}
@media(max-width:600px){.home-grid{grid-template-columns:1fr} .home-card{min-height:125px} .zh{font-size:21px} .wordbtn,.answer-token{font-size:17px}}
</style>
</head>
<body>
<div class="wrap">
<section id="home">
<h1>🧩 姊弟英文句子重組</h1>
<div class="small">看自然中文提示，把英文單字重新排成完整句子。小三、小六分流；小六另外分「基礎／進階／挑戰」。</div>
<div class="home-grid">
<button class="home-card g3" onclick="enter('g3')"><strong>🧒 小三</strong><span>生活化句子、核心時態、問句、祈使句、頻率副詞。<br>目前 40 題。</span></button>
<button class="home-card g6" onclick="enter('g6')"><strong>👧 小六</strong><span>加長句子，加入完成式、條件句、關係子句、被動語態等。<br>目前 96 題。</span></button>
</div>
<div class="note">這版把「難度」放在句型和文法，不靠艱深單字。答錯會立即顯示紅色 ❌，並顯示正確句子。</div>
</section>

<section id="app" class="hidden">
<div class="topbar">
<div><h2 id="title"></h2><div id="subtitle" class="small"></div></div>
<button onclick="goHome()">← 換年級</button>
</div>
<div class="card">
<div class="controls">
<label>難度　
<select id="levelFilter" onchange="resetRound()"></select>
</label>
<label>文法　
<select id="grammarFilter" onchange="resetRound()"><option value="全部">全部文法</option></select>
</label>
<button class="primary" onclick="resetRound()">🎲 重新抽題</button>
</div>
<div class="small" style="margin-top:10px">每輪會隨機出題，盡量避免短時間重複。</div>
</div>

<div class="card">
<div class="topbar"><div class="stats">第 <span id="num">1</span> 題　｜　答對 <span id="score">0</span>　答錯 <span id="wrong">0</span></div><div class="stats">題庫 <span id="poolCount"></span> 題</div></div>
<div class="progress"><div id="bar" style="width:0%"></div></div>
<div class="zh" id="zh"></div>
<div class="meta"><span class="chip" id="grammarChip"></span><span class="chip" id="levelChip"></span></div>
<div class="answer-zone" id="answerZone"><span class="small" id="placeholder">點下面的英文片段，依序排到這裡。</span></div>
<div class="word-bank" id="wordBank"></div>
<div id="feedback" class="hidden"></div>
<div class="action-row">
<button onclick="undo()">↩️ 退一步</button>
<button onclick="clearAnswer()">清空</button>
<button class="primary" id="checkBtn" onclick="checkAnswer()">檢查答案</button>
<button id="nextBtn" class="hidden" onclick="nextQuestion()">下一題 →</button>
</div>
</div>
</section>
</div>

 "He ran so fast that I couldn't keep up with him.", "grammar": "so...that", "level": "挑戰"}, {"zh": "那部電影太有趣了，我看了兩次。", "en": "The movie was so interesting that I watched it twice.", "grammar": "so...that", "level": "挑戰"}, {"zh": "天氣冷到湖面都結冰了。", "en": "It was so cold that the lake froze.", "grammar": "so...that", "level": "挑戰"}, {"zh": "我一邊聽音樂，一邊整理房間。", "en": "I cleaned my room while listening to music.", "grammar": "分詞片語", "level": "挑戰"}, {"zh": "完成作業後，她去幫媽媽準備晚餐。", "en": "After finishing her homework, she helped Mom prepare dinner.", "grammar": "動名詞片語", "level": "挑戰"}, {"zh": "不知道答案時，我會先看上下文找線索。", "en": "When I don't know the answer, I look at the context for clues first.", "grammar": "時間子句", "level": "挑戰"}, {"zh": "學新單字時，我喜歡把它放進完整句子裡。", "en": "When learning a new word, I like to put it in a complete sentence.", "grammar": "分詞片語", "level": "挑戰"}, {"zh": "雖然這篇文章有幾個生字，我還是能懂大意。", "en": "Although there are a few new words in this article, I can still understand the main idea.", "grammar": "although", "level": "挑戰"}, {"zh": "如果句子太長，我會先找主詞和動詞。", "en": "If a sentence is too long, I look for the subject and verb first.", "grammar": "if", "level": "挑戰"}]};
let mode='g3', pool=[], order=[], pos=0, score=0, wrong=0, chosen=[], checked=false;
const $=id=>document.getElementById(id);

function enter(m){
  mode=m; $('home').classList.add('hidden'); $('app').classList.remove('hidden');
  $('title').textContent=m==='g3'?'🧒 小三｜句子重組':'👧 小六｜句子重組';
  $('subtitle').textContent=m==='g3'?'生活化核心句型':'文法書銜接：基礎 → 進階 → 挑戰';
  const lf=$('levelFilter'); lf.innerHTML='';
  const levels=m==='g3'?['全部']:['全部','基礎','進階','挑戰'];
  levels.forEach(x=>{let o=document.createElement('option');o.value=x;o.textContent=x;lf.appendChild(o)});
  resetRound();
}
function goHome(){$('app').classList.add('hidden');$('home').classList.remove('hidden')}
function rebuildGrammarOptions(){
  const lf=$('levelFilter').value||'全部';
  const base=DATA[mode].filter(q=>lf==='全部'||q.level===lf);
  const grammars=[...new Set(base.map(q=>q.grammar))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
  const gf=$('grammarFilter'), old=gf.value; gf.innerHTML='<option value="全部">全部文法</option>';
  grammars.forEach(g=>{let o=document.createElement('option');o.value=g;o.textContent=g;gf.appendChild(o)});
  if(grammars.includes(old)) gf.value=old;
}
function resetRound(){
  rebuildGrammarOptions();
  const lv=$('levelFilter').value||'全部', gr=$('grammarFilter').value||'全部';
  pool=DATA[mode].filter(q=>(lv==='全部'||q.level===lv)&&(gr==='全部'||q.grammar===gr));
  order=[...Array(pool.length).keys()];
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  pos=0;score=0;wrong=0;$('score').textContent=0;$('wrong').textContent=0;$('poolCount').textContent=pool.length;
  showQuestion();
}
function chunks(sentence){
  const clean=sentence.replace(/[.?]$/,'');
  const words=clean.split(' ');
  let out=[];
  for(let i=0;i<words.length;){
    let n=1;
    if(mode==='g6' && words.length>=8 && Math.random()<0.55) n=Math.min(2,words.length-i);
    out.push(words.slice(i,i+n).join(' ')); i+=n;
  }
  let shuffled=out.map((t,i)=>({t,i}));
  for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
  if(shuffled.map(x=>x.i).every((x,i)=>x===i) && shuffled.length>1) [shuffled[0],shuffled[1]]=[shuffled[1],shuffled[0]];
  return {correct:out, shuffled};
}
let current=null, parts=null;
function showQuestion(){
  if(!pool.length){$('zh').textContent='這個篩選目前沒有題目。';$('wordBank').innerHTML='';return}
  if(pos>=order.length){resetRound();return}
  current=pool[order[pos]]; parts=chunks(current.en); chosen=[]; checked=false;
  $('num').textContent=pos+1; $('zh').textContent=current.zh; $('grammarChip').textContent='文法：'+current.grammar; $('levelChip').textContent='難度：'+current.level;
  $('feedback').className='hidden';$('feedback').innerHTML='';$('nextBtn').classList.add('hidden');$('checkBtn').disabled=false;
  renderAnswer(); renderBank(); $('bar').style.width=((pos/order.length)*100)+'%';
}
function renderAnswer(){
  const z=$('answerZone'); z.innerHTML='';
  if(!chosen.length){z.innerHTML='<span class="small" id="placeholder">點下面的英文片段，依序排到這裡。</span>';return}
  chosen.forEach((idx,k)=>{let b=document.createElement('button');b.className='answer-token';b.textContent=parts.shuffled[idx].t;b.onclick=()=>{if(checked)return;chosen.splice(k,1);renderAnswer();renderBank()};z.appendChild(b)})
}
function renderBank(){
  const b=$('wordBank');b.innerHTML='';
  parts.shuffled.forEach((x,i)=>{let bt=document.createElement('button');bt.className='wordbtn'+(chosen.includes(i)?' used':'');bt.textContent=x.t;bt.disabled=checked||chosen.includes(i);bt.onclick=()=>{chosen.push(i);renderAnswer();renderBank()};b.appendChild(bt)})
}
function undo(){if(checked||!chosen.length)return;chosen.pop();renderAnswer();renderBank()}
function clearAnswer(){if(checked)return;chosen=[];renderAnswer();renderBank()}
function normalize(s){return s.replace(/[.?!]/g,'').replace(/\s+/g,' ').trim().toLowerCase()}
function checkAnswer(){
  if(checked)return;
  if(chosen.length!==parts.shuffled.length){const f=$('feedback');f.className='feedback bad';f.innerHTML='❌ 還沒有排完喔。';return}
  checked=true; $('checkBtn').disabled=true;
  const mine=chosen.map(i=>parts.shuffled[i].t).join(' ');
  const ok=normalize(mine)===normalize(current.en);
  const f=$('feedback');
  if(ok){score++;$('score').textContent=score;f.className='feedback good';f.innerHTML='✅ 答對了！<div class="correct-line">'+current.en+'</div>'}
  else{wrong++;$('wrong').textContent=wrong;f.className='feedback bad';f.innerHTML='❌ 這題還差一點。<div class="correct-line">正確句子：'+current.en+'</div>'}
  renderBank();$('nextBtn').classList.remove('hidden');
}
function nextQuestion(){pos++;if(pos>=order.length){pos=0;for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}}showQuestion()}
</script>
